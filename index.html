<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>九轉丹房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1210'/%3E%3Cpath d='M22 12v10M42 12v10' stroke='%23c9a15a' stroke-width='5'/%3E%3Cpath d='M10 22h44v4l-5 20H15l-5-20z' fill='%23c9a15a'/%3E%3Cpath d='M19 46v9M45 46v9' stroke='%23c9a15a' stroke-width='5'/%3E%3Cpath d='M32 28c-6 5-7 10-3 14 0-3 2-4 3-6 2 2 3 4 1 6 5-2 6-9-1-14z' fill='%23de4e2f'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
/* Layout: 一屏丹房 — 左：丹方｜中：丹爐（紀錄、出丹疊喺爐上）＋投料＋開爐｜右：藥櫃；手機：爐在上，丹方/藥櫃分頁 */
:root{
  --ink:#1a1210; --panel:#241915; --panel2:#30221c; --line:#4b372a;
  --bronze:#c9a15a; --cinnabar:#de4e2f; --jade:#74b89c; --paper:#ecdfc8; --muted:#a8937a; --dim:#5e4a3c;
  --display:"Ma Shan Zheng","STKaiti","KaiTi","BiauKai",serif;
  --body:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --el-m:#d9c27a; --el-w:#86b86b; --el-s:#62a9d6; --el-f:#e2583c; --el-e:#b78d55;
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;max-width:1500px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;margin:0;color:var(--bronze);letter-spacing:.05em;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;align-items:center;flex:1;min-width:0}
.stat{display:flex;align-items:center;gap:5px;white-space:nowrap}
.stat b{font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);letter-spacing:.08em}
.meter{width:56px;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;transition:width .5s}
.realm{font-family:var(--display);font-size:22px;color:var(--bronze);line-height:1}
.hbtns{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:4px 10px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--bronze)}
.btn.danger{border-color:#7a3322}

.main{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(250px,310px);gap:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;line-height:1.1}
h2 span{font-family:var(--body);font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.group{display:flex;flex-direction:column;gap:4px}
.label{font-size:11.5px;color:var(--muted);letter-spacing:.22em;display:flex;justify-content:space-between}
.label em{font-style:normal;letter-spacing:0;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:13.5px}
.chip:hover:not(:disabled){border-color:var(--bronze)}
.chip[aria-pressed="true"]{border-color:var(--bronze);background:#4a3520;color:#fff3da}
.chip:disabled{opacity:.5;cursor:default}
.desc{font-size:12px;color:var(--muted);line-height:1.45}
.heat-row{display:flex;align-items:center;gap:8px}
input[type=range]{flex:1;accent-color:var(--cinnabar);min-width:0}
.heat-val{font-family:var(--display);font-size:22px;width:2.8em;text-align:right;color:var(--cinnabar);line-height:1}
.heat-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hint{font-size:12px;color:var(--jade)}

.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.ing{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 7px;min-width:0}
.ing:hover:not(:disabled){border-color:var(--bronze)}
.ing:disabled{opacity:.4;cursor:not-allowed}
.ing .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ing .meta{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ing.locked{border-style:dashed;color:var(--dim);cursor:default}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.tip{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;min-height:3em}

/* 中間丹爐 */
.center{display:flex;flex-direction:column;gap:8px;min-height:0}
.stage{position:relative;flex:1;min-height:180px;border-radius:6px;overflow:hidden;background:#120c0a;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.stage-top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:12px;color:var(--muted)}
.stage-top b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--bronze)}
.slog{position:absolute;left:10px;bottom:8px;right:10px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;font-size:12.5px;pointer-events:none;text-shadow:0 1px 3px #000}
.slog li{display:flex;gap:6px}
.slog li:nth-last-child(n+5){opacity:.35}
.slog .t{font-family:var(--display);color:var(--bronze);flex:none}
.good{color:var(--jade)} .bad{color:#f08a6c} .boom{color:var(--cinnabar);font-weight:600}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(18,12,10,.72)}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;border:1px solid var(--bronze);border-radius:6px;padding:12px;background:linear-gradient(180deg,#3a2a1c,var(--panel));display:flex;flex-direction:column;gap:8px}
.pill-head{display:flex;gap:12px;align-items:center}
.pill-orb{width:48px;height:48px;border-radius:50%;flex:none}
.pill-name{font-family:var(--display);font-size:30px;line-height:1.1;color:#fff0d4}
.pill-grade{font-size:12px;color:var(--bronze);letter-spacing:.12em}
.card p{margin:0}
.pill-props{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted)}
.tag.bad{border-color:#8a3a26;color:#f08a6c}.tag.good{border-color:#3f6e5b;color:var(--jade)}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pill-count{font-family:var(--display);font-size:22px;color:var(--bronze);margin-left:6px}
.testers{display:flex;flex-direction:column;gap:4px}
.tester{display:flex;flex-direction:column;align-items:flex-start;text-align:left;white-space:normal}
.tester b{font-weight:600}
.tester small{font-size:11.5px;color:var(--muted)}
.more-row{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:6px 4px;display:flex;flex-direction:column;align-items:center}
.act b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1}
.act small{font-size:10.5px;color:var(--muted)}
.act:hover{border-color:var(--bronze)} .act.eat{border-color:var(--cinnabar)}
.outcome{font-size:13.5px;border-left:3px solid var(--cinnabar);padding-left:10px;display:flex;flex-direction:column;gap:3px}
.fx{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.close{align-self:flex-end}
.death-card{border-color:var(--cinnabar);background:#2a0f0a}

.dock{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.dock-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.order{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0;min-height:30px;align-items:center}
.order li{display:flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 2px 1px 6px;font-size:13px}
.order li.empty{border:0;background:none;color:var(--muted);font-size:12.5px;padding:0}
.role{font-family:var(--display);font-size:17px;color:var(--bronze);line-height:1}
.ib{background:transparent;border:0;border-radius:3px;width:22px;height:24px;color:var(--muted);padding:0}
.ib:hover:not(:disabled){color:var(--paper);background:var(--line)}
.ib:disabled{opacity:.2}
.wx{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex:1;min-width:0}
.wx-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel2);flex:1;min-width:60px}
.wx-bar i{display:block;height:100%;transition:width .3s}
.yy-track{width:80px;height:6px;background:linear-gradient(90deg,var(--el-s),var(--panel2) 50%,var(--el-f));border-radius:3px;position:relative;flex:none}
.yy-track i{position:absolute;top:-3px;width:3px;height:12px;background:var(--paper);border-radius:2px;transform:translateX(-50%);transition:left .3s}
.go{font-family:var(--display);font-size:24px;letter-spacing:.25em;padding:4px 16px;border-radius:5px;border:1px solid var(--cinnabar);background:#5a1d12;color:#ffe9d6;white-space:nowrap}
.go:hover:not(:disabled){background:#7a2716}
.go:disabled{opacity:.45;cursor:not-allowed}
.cost{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cost b{color:var(--paper)}
.rate{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rate b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;margin-left:3px}
.rate.hi b{color:var(--jade)}.rate.mid b{color:var(--bronze)}.rate.lo b{color:var(--cinnabar)}
.ing .bag{color:var(--jade);font-weight:600}

.tabs{display:none}
@media (max-width:860px){
  h1{font-size:26px;flex:1}
  header.top{gap:4px 10px;padding-bottom:6px}
  .stats{order:3;flex:1 1 100%;gap:2px 12px;font-size:11.5px}
  .realm{font-size:18px}
  .meter{width:40px}
  .hbtns{gap:4px}
  .hbtns .btn{padding:2px 6px;font-size:11.5px;letter-spacing:0}
  .overlay{position:fixed;z-index:25;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .order li{font-size:12px}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(100px,.7fr) auto auto auto minmax(0,1.5fr);gap:6px}
  .app{gap:6px}
  .panel{padding:8px;gap:6px}
  .panel h2{display:none}
  .desc{font-size:11px}
  .chip{padding:2px 7px;font-size:12.5px}
  .tip{display:none}
  .ing{padding:3px 5px}
  .ing .nm{font-size:12px;gap:3px}
  .ing .meta{font-size:9.5px}
  .dock{padding:6px 8px;gap:4px}
  .wx{flex:1 1 100%}
  #dockBook,#dockCar,#dockRoom,#dockShop{display:none}
  .go{margin-left:auto}
  .rate b{font-size:19px}
  .hbtns{flex-wrap:wrap}
  .center{display:contents}
  .stage{grid-row:1;min-height:0}
  .inner-row{grid-row:2;gap:4px}
  .dz{padding:3px 5px;gap:5px}
  .dz-av{width:24px;height:24px;font-size:15px}
  .dz-tx b{font-size:12px}
  .dz-tx small{font-size:10px}
  .dock{grid-row:3}
  .tabs{display:flex;grid-row:4;gap:4px}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:3px;font-family:var(--display);font-size:18px}
  .tabs button[aria-selected="true"]{border-color:var(--bronze);background:#4a3520}
  .panel{grid-row:5}
  .panel.off{display:none}
  .panel.h1 .g1,.panel.h2 .g2{display:none}
  .tabs button{font-size:16px}
  .shelf{grid-template-columns:repeat(4,minmax(0,1fr))}
  .go{font-size:20px;padding:3px 12px}
  .yy-track{width:56px}
}
@media (max-width:860px) and (max-height:720px){.main{grid-template-rows:minmax(80px,.4fr) auto auto auto minmax(0,1.6fr)}h1{font-size:22px}.stats{font-size:11px;gap:2px 10px}.meter{width:36px}.heat-scale{display:none}}
@media (max-width:360px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}

.modal{position:fixed;inset:0;z-index:30;background:rgba(10,7,6,.8);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbox{width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--bronze);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mtabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:none}
#modal>.mbox{height:min(720px,100%);max-width:820px;overflow:hidden}
.mscroll{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.mtabs .btn[aria-selected="true"]{border-color:var(--bronze);background:#4a3520}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.ach{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--panel2);display:flex;flex-direction:column;gap:1px}
.ach b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--bronze);line-height:1.2}
.ach.no{opacity:.55}.ach.no b{color:var(--muted)}
.ach small{font-size:11.5px;color:var(--muted)}
.ach .u{font-size:11.5px;color:var(--jade)}
.codex{display:flex;flex-wrap:wrap;gap:4px}
.codex span{font-size:13px;padding:1px 7px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.codex span.unk{color:var(--dim)}
.codex .cx{font-size:13px;padding:1px 7px;border-radius:3px;background:#4a3520;border:1px solid var(--bronze);color:#fff3da;display:inline-flex;align-items:baseline;gap:3px}
.codex .cx:hover:not(:disabled){background:#5d4329}
.codex .cx:disabled{opacity:.5;cursor:not-allowed;background:var(--panel2);border-color:var(--line)}
.codex .cx small{font-size:10.5px;color:var(--jade)}
.cheat{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cheat input{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;color:var(--paper);font:inherit;min-width:0;flex:1;max-width:240px}
.meter.wide{width:90px;display:inline-block;vertical-align:middle}
.car-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.car-box{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:5px;min-width:0}
.car-title{font-family:var(--display);font-size:22px;color:var(--bronze);line-height:1.2}
.car-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.car-act input{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 8px;color:var(--paper);font:inherit;flex:1;min-width:0;max-width:200px}
.sect-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px}
.sect-list .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;white-space:normal}
.sect-list small{font-size:11px;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mems{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.mem{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0}
.mem.cand{border-style:dashed}
.mem-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mem-h b{font-size:14px}
.mem-h .ib{margin-left:auto}
.mem .chip{padding:1px 6px;font-size:12px}
.team-sum{color:var(--jade)}
.rel-wrap{overflow-x:auto}
.rel-svg{display:block;width:100%;min-width:520px;height:auto;max-height:440px}
.rl-n{cursor:pointer}.rl-n:hover circle,.rl-n:focus circle{stroke-width:3;filter:brightness(1.3)}
.rl-n:focus{outline:none}
.rl-c{fill:#fff0d4;text-anchor:middle;font-family:var(--display)}
.rl-name{fill:var(--paper);text-anchor:middle;font-size:12px}
.rl-sub{fill:var(--muted);text-anchor:middle;font-size:10.5px}
.rl-e{text-anchor:middle;font-size:11px;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.rl-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px}
.visit{color:var(--jade);font-weight:600}
.mem.visitor{border-color:var(--jade)}
.tbl-wrap{overflow-x:auto}
.mkt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mkt th{font-weight:400;color:var(--muted);text-align:left;font-size:12px;letter-spacing:.1em}
.mkt th,.mkt td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.mkt .btn{padding:1px 7px}
.mkt .num{width:1%;text-align:right;padding-left:2px;padding-right:4px}
.mkt .acts{width:1%;text-align:right}
.mkt .acts .btn+.btn{margin-left:4px}
.mkt th.acts{font-size:11px;letter-spacing:0}
@media (max-width:860px){
  .mkt{font-size:12px}
  .mkt th,.mkt td{padding:4px 2px}
  .mkt .btn{padding:1px 4px;font-size:12px}
  .mkt .acts .btn+.btn{margin-left:2px}
  .mkt .tag{padding:0 2px;font-size:10px}
}
@media (max-width:380px){
  .mkt{font-size:11px}
  .mkt .btn{padding:1px 3px;font-size:11px}
}
.btn.wrap{white-space:normal;text-align:left}
.up{color:var(--jade)}.dn{color:var(--cinnabar)}
.dlbtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:12.5px}
.dlbtn:hover{border-color:var(--cinnabar)}
.heart{color:var(--cinnabar);font-variant-numeric:tabular-nums}
.lives{display:flex;flex-direction:column;gap:8px}
.life{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:5px}
.life.cur{border-color:var(--jade)}
.life-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.life-h b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--bronze)}
.life-st{font-size:12px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0 0 0 10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:13px;max-height:180px;overflow-y:auto}
.tl li{display:flex;gap:8px}
.tl li span{color:var(--muted);flex:none;width:4.2em;font-variant-numeric:tabular-nums}
.card .lives .tl{max-height:120px}

<body>
<div class="app">

      <button class="btn" id="openAch" type="button">成就</button>

    </div>

    <section class="panel" id="pShelf" aria-labelledby="h-shelf">

</div>

      <span style="flex:1"></span>
      <button class="btn danger" type="button" id="reset">全部重來</button>

    <div class="desc" id="mMsg"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

const TOP=8; // 渡劫期，再上就要渡天劫飛升
function realmName(r,c){
  if(r>=9)return'飛升';
  if(r===0)return'煉氣'+CN[clamp(1+Math.floor((c||0)/11.2),1,9)]+'層';
  return REALMS[r]+['初期','中期','後期','圓滿'][clamp(Math.floor((c||0)/25),0,3)];
}
function breakthrough(){
  const pl=P();const ups=[];
  while(pl.cult>=100&&pl.realm<TOP){pl.cult-=100;pl.realm++;ups.push(REALMS[pl.realm]);}
  if(pl.realm>=TOP)pl.cult=Math.min(pl.cult,100);
  save.st.maxRealm=Math.max(save.st.maxRealm,pl.realm);
  return ups;
}

function headD(){const c=C();return c.head?inner().find(x=>x.id===c.head)||null:null;}

function discCultUp(m,n){if(m.cult===undefined)return'';m.cult+=n;let t='修為 +'+Math.round(n)+'%';while(m.cult>=100&&m.realm<TOP){m.cult-=100;m.realm++;t+='，突破到「'+REALMS[m.realm]+'」';}return t;}
function discSkillUp(m,xp){m.xp=(m.xp||0)+xp;let t='';while(m.skill<10&&m.xp>=(m.skill+1)*8){m.xp-=(m.skill+1)*8;m.skill++;t='，丹術升到'+SKILL_N[m.skill];}return t;}

const ROOM_LV=[{n:'丹櫃',cap:10,cost:0},{n:'丹格',cap:25,cost:400},{n:'丹室',cap:50,cost:1200},{n:'丹閣',cap:100,cost:3000},{n:'丹庫',cap:200,cost:8000}];

const BAGS=[{n:'粗布藥囊',cap:20,extra:0,guard:0,d:'藥囊最多放 20 份藥材'},{n:'儲物袋',p:300,cap:50,extra:1,guard:0,d:'藥囊 50 份，採藥多 1 份'},{n:'乾坤袋',p:1500,cap:120,extra:2,guard:.5,d:'藥囊 120 份，採藥多 2 份，被搶、被圍剿、中伏損失減半'},{n:'須彌袋',p:6000,cap:300,extra:3,guard:.5,d:'藥囊 300 份，採藥多 3 份，損失減半'}];
function DR(){const pl=P();if(!pl.dr)pl.dr={lvl:0,stacks:[],bottle:0,bagLv:0};return pl.dr;}
function roomCap(){return ROOM_LV[DR().lvl].cap;}
function roomCount(){return DR().stacks.reduce((a,s)=>a+s.count,0);}
function bagCap(){return BAGS[DR().bagLv].cap;}
function bagCount(){return Object.values(bag()).reduce((a,b)=>a+b,0);}
function bagAdd(id,n){const room=bagCap()-bagCount();const k=Math.max(0,Math.min(n,room));if(k>0){const b=bag();b[id]=(b[id]||0)+k;}return k;}
function guardMul(){return 1-BAGS[DR().bagLv].guard;}
function storePill(p,n){
  const dr=DR();n=Math.min(n,roomCap()-roomCount());if(n<=0)return 0;
  const st=dr.stacks.find(s=>s.name===p.name&&s.grade===p.grade&&s.kind===p.kind);
  if(st){st.Q=(st.Q*st.count+p.Q*n)/(st.count+n);st.count+=n;}
  else{const c=Object.assign({},p);c.count=n;dr.stacks.push(c);}
  return n;
}
function roomDecay(msgs){
  const dr=DR();const loss=BOTTLES[dr.bottle].loss;if(!dr.stacks.length)return;
  dr.stacks.forEach(s=>{
    s.Q=Math.max(1,s.Q*(1-loss));
    const g=s.Q<15?0:s.Q<45?1:s.Q<80?2:s.Q<120?3:4;
    if(loss>0&&g<s.grade&&!FAIL_KINDS.includes(s.kind)){s.grade=g;s.gradeName=GRADES[g];if(g===0){s.kind='waste';}msgs.push('丹室入面嘅'+s.name+'藥力流失，跌咗做'+GRADES[g]);}
    if(loss<0&&g>s.grade&&s.grade<4){s.grade=Math.min(4,g);s.gradeName=GRADES[s.grade];msgs.push('紫金瓶溫養，'+s.name+'升咗做'+GRADES[s.grade]);}
  });
}

}
function upgradeRoom(){const dr=DR();const nx=ROOM_LV[dr.lvl+1];if(!nx)return;if(P().stones<nx.cost){bookMsg('靈石唔夠，要 '+nx.cost);return;}P().stones-=nx.cost;dr.lvl++;bio('丹房擴建為「'+nx.n+'」');bookMsg('擴建成「'+nx.n+'」，可以放 '+nx.cap+' 粒丹。');afterAction();}

/* ---------- 丹市：飽和同黑市 ---------- */
function market(){if(!save.market)save.market={};return save.market;}
function isBlack(p){return MO().on||p.path==='mo'||p.path==='du';}
function basePrice(p){
  let v=GRADE_BASE[p.grade]*pidx(p.name).i;const black=isBlack(p);
  if(black)v*=1.2;
  if(['raw','burnt','meng','chicken'].includes(p.kind))v*=.5;if(p.kind==='waste')v=1;
  const c=C();if(!black&&c.aff==='xie')v*=1.1;if(!black&&c.aff==='own'&&c.lvl>=2)v*=1.2;
  return v;
}
function satMult(name,extra){const u=(market()[name]||0)+(extra||0);return 1/(1+u*.12);}
function quoteN(p,n){let t=0;for(let i=0;i<n;i++)t+=Math.max(1,Math.round(basePrice(p)*satMult(p.name,i)));return t;}
function sellValue(p){return quoteN(p,1);}
function marketDecay(){const M=market();Object.keys(M).forEach(k=>{M[k]*=.75;if(M[k]<.3)delete M[k];});}
function doSell(n,auto,quiet){
  const p=current;if(!p)return;n=Math.min(n,p.count||1);
  const black=isBlack(p);let v=quoteN(p,n);const lines=[];let sold=true;
  const where=black?'黑市':'丹閣';
  if(black&&!auto){
    const m=MO();const amb=.08+(m.on?m.infamy*.003:0);const r=rnd();
    if(r<amb){
      sold=false;v=0;const lost=Math.round(P().stones*.15*guardMul());P().stones-=lost;gainCult(-8);if(m.on)m.infamy+=5;
      lines.push(['你喺黑市交收嗰陣，正道弟子突然殺出嚟！'+n+' 粒'+p.name+'全部被沒收，你仲要賠 '+lost+' 靈石先脫身，修為 −8%'+(m.on?'，惡名 +5':'')+'。','bad']);bio('黑市賣丹中伏，被正道圍捕');
    }else if(r<amb+.07){
      sold=false;v=0;gainCult(-5);if(rnd()<.4)addNPC({key:'hei',name:'黑市刀客',rel:'chou',note:'喺黑市黑吃黑搶你丹藥',lv:1});
      lines.push(['買家收咗貨，一轉身就拔刀，黑吃黑！你打唔過，'+n+' 粒'+p.name+'白白送咗畀人。修為 −5%','bad']);
    }else if(r<amb+.13){
      v=Math.round(v*1.5);lines.push(['撞正魔門大客，出價特別高。','good']);
    }else if(r<amb+.18){
      v=Math.round(v*.7);lines.push(['官差突然巡市，你要即刻甩貨，被人壓價三成。','bad']);
    }
  }
  if(sold){market()[p.name]=(market()[p.name]||0)+n;P().stones+=v;save.st.earned+=v;LN().earned+=v;
    lines.unshift([where+(black?'買家':'掌櫃')+'收'+(n>1?'晒你 '+n+' 粒':'咗你粒')+p.name+'，畀咗 '+v+' 靈石。']);
    if(satMult(p.name)<.7)lines.push(['市面上'+p.name+'太多，價錢已經被壓低，過幾年先會回升。']);}
  p.count=(p.count||1)-n;if(p.count<=0)current=null;
  if(auto)return v;
  if(quiet){afterAction();return lines;}
  showOutcome(black?'黑市賣丹':'賣丹',lines,'');
  afterAction();
}

/* ---------- 忠誠度、升降 ---------- */
function isInner(m){return inner().includes(m);}
function loyBase(m){if(isInner(m))return 70;const h=headD();return(m.fame?65:50)+(h&&loy(h)>=50?5:0);}
function loy(m){if(m.loy===undefined)m.loy=loyBase(m);return m.loy;}
function addLoy(m,d){m.loy=clamp(loy(m)+d,0,100);}
function loyMult(m){const l=loy(m);return l<30?.5:l>=80?1.1:1;}
function loyTag(m){const l=Math.round(loy(m));return'<span class="tag '+(l<30?'bad':l>=80?'good':'')+'" title="低過 30 做嘢效果減半；80 以上多一成；低過 15 每年有機會叛出師門">忠誠 '+l+'</span>';}
function aptFromSkill(sk){return sk<=2?0:sk<=4?1:sk<=6?2:sk<=8?3:4;}
function promote(id,swapId){
  const c=C();const m=c.members.find(x=>x.id===id);if(!m)return;
  if(m.apt===undefined)m.apt=aptFromSkill(m.skill);
  if(m.age===undefined)m.age=16+Math.floor(rnd()*15);
  if(m.cult===undefined)m.cult=0;
  if(inner().length>=innerCap()){
    const d=inner().find(x=>x.id===swapId);if(!d)return;
    c.inner=inner().filter(x=>x!==d);c.members=c.members.filter(x=>x!==m);
    c.members.push(d);inner().push(m);addLoy(d,-30);
    bio(d.name+'被降為記名弟子，'+m.name+'升為入室弟子');
  }else{c.members=c.members.filter(x=>x!==m);inner().push(m);bio(m.name+'升為入室弟子');}
  addLoy(m,20);c.members.forEach(x=>{if(x!==m)addLoy(x,-5);});
  afterAction();
  return m;
}
function demote(id){
  const c=C();const d=inner().find(x=>x.id===id);if(!d)return false;
  if(c.members.length>=capOf())return false;
  c.inner=inner().filter(x=>x!==d);c.members.push(d);addLoy(d,-30);
  inner().forEach(x=>addLoy(x,-5));bio(d.name+'被降為記名弟子');
  afterAction();return true;
}
function loyTick(msgs){
  const c=C();
  inner().concat(c.members).slice().forEach(m=>{
    m.gifts=0;const b=loyBase(m);const l=loy(m);if(l<b)addLoy(m,1);else if(l>b)addLoy(m,-.5);
    if(loy(m)<15&&rnd()<.2){
      c.members=c.members.filter(x=>x!==m);c.inner=inner().filter(x=>x!==m);
      msgs.push(m.name+'對你心灰意冷，叛出師門');bio(m.name+'叛出師門');addNPC({name:m.name,rel:'pan',note:'叛出師門嘅前弟子'});
    }
  });
}

function yearTick(){
  const pl=P();if(pl.ly===undefined)pl.ly=pl.age;
  let yrs=pl.age-pl.ly;pl.ly=pl.age;if(yrs<=0)return;
  const msgs=[];const c=C();
  while(yrs-->0){
    inner().slice().forEach(d=>{
      d.age++;d.cult+=(1.2+d.skill*.12)*APT[d.apt].g*(d.pers==='lan'?.5:1)/(1+d.realm*1.2);
      while(d.cult>=100&&d.realm<TOP){d.cult-=100;d.realm++;msgs.push('入室弟子'+d.name+'突破到「'+REALMS[d.realm]+'」');}
      if(d.realm>=TOP)d.cult=Math.min(d.cult,100);
      if(d.age>=innerLife(d)){c.inner=inner().filter(x=>x!==d);save.st.oldAge=(save.st.oldAge||0)+1;LN().oldAge++;bio('入室弟子'+d.name+'壽終坐化');msgs.push('入室弟子'+d.name+'壽元耗盡，安詳坐化，享年 '+d.age+' 歲');}
    });
    loyTick(msgs);dlTick(msgs);marketDecay();priceTick();roomDecay(msgs);
    pl.tox=Math.max(0,pl.tox-2);pl.demon=Math.max(0,pl.demon-1);
    if(pl.alive&&rnd()<.22)queueHome();
    if(!c.visitors)c.visitors=[];
    c.visitors=c.visitors.filter(v=>{v.wait--;if(v.wait<=0){msgs.push(v.name+'等唔到你回覆，失望離開');return false;}return true;});
    if(c.aff&&!MO().on&&c.visitors.length<3){
      const ch=c.cert*2+(c.aff==='own'?5+c.lvl*6:c.aff==='sect'?3:1);
      if(rnd()*100<ch){const m=genCand();m.cost=0;m.fame=1;m.loy=80+Math.floor(rnd()*16);m.apt=aptFromSkill(m.skill);m.wait=3;c.visitors.push(m);msgs.push(m.name+'慕名而嚟求見，撳「記名」格睇吓收唔收');}
    }
  }
  if(msgs.length)toast(msgs.join('；'),5000);
}

function grab(){
  if(busy||!P().alive||!MO().on)return;
  const m=MO();const pl=P();pl.age+=1;
  const room=PRISON_CAP-m.prisoners.length;
  const lines=[];
  if(room<=0){lines.push(['牢房已經爆滿，你喺山下行咗一年，乜都冇捉到。']);}
  else{
    const n=Math.min(room,1+Math.floor(rnd()*3));const got=[];
    for(let i=0;i<n;i++){const v={id:m.nid++,name:SURN[Math.floor(rnd()*SURN.length)]+MORTAL_JOB[Math.floor(rnd()*MORTAL_JOB.length)],role:'idle'};m.prisoners.push(v);got.push(v.name);}

    lines.push(['惡名 +'+(8*n)+'。正道開始留意你。','bad']);

function moTick(){
  const m=MO();const pl=P();
  if(!m.on){m.last=pl.age;return;}
  let yrs=pl.age-(m.last||pl.age);m.last=pl.age;
  while(yrs-->0&&pl.alive){
    m.infamy=Math.max(0,m.infamy-2);
    const esc=m.prisoners.filter(()=>rnd()<.06);
    if(esc.length){m.prisoners=m.prisoners.filter(x=>!esc.includes(x));m.infamy+=4*esc.length;notice(esc.map(x=>x.name).join('、')+'趁夜逃走咗，周圍話你知。惡名 +'+4*esc.length,'bad');}
    if(rnd()*100<m.infamy*.4){
      if(m.infamy>=80&&rnd()<.25){endLife('被正道斬殺','正道各派聯手殺上山門，你力戰三日三夜，終於被斬於丹爐之前。');return;}
      const lost=Math.round(pl.stones*.3*guardMul());pl.stones-=lost;pl.cult=Math.max(0,pl.cult-10);
      const freed=m.prisoners.length;m.prisoners=[];m.infamy=Math.max(0,m.infamy-20);
      notice('正道殺上門圍剿！你重傷逃脫，損失 '+lost+' 靈石，修為 −10%'+(freed?'，'+freed+' 個凡人被救走':'')+'。','bad');
    }
  }
}

  h+='<div class="desc bad">惡名越高，每年越大機會被正道圍剿；惡名 80 以上有機會被斬殺。凡人每年都有機會逃走。心魔跌返 40 以下就會放下屠刀。</div><div class="mems">';

function bookFx(){const f={q:0,stab:0,heat:1,hint:0,safe:0};books().forEach(id=>{const x=BOOKS[id].fx;if(!x)return;f.q+=x.q||0;f.stab+=x.stab||0;if(x.heat)f.heat*=x.heat;if(x.hint)f.hint=1;if(x.safe)f.safe=1;});return f;}

function recipes(){if(!save.recipes)save.recipes={};return save.recipes;}
function mastery(){if(!save.mastery)save.mastery={};return save.mastery;}
function sigOf(r){return[r.path,r.art,r.fire,r.furn,r.heat||'',r.order.join(',')].join('|');}
function learnRecipe(r,src){
  const pv=previewRecipe(r);if(!pv)return;
  const R=recipes();
  if(R[pv.name]&&R[pv.name].g>=pv.g)return;
  R[pv.name]={cfg:{path:r.path,art:r.art,fire:r.fire,furn:r.furn,heat:pv.heat,order:r.order.slice()},src,g:pv.g};
}
function gradeFromQ(Q,fire,furn){let g=Q<15?0:Q<45?1:Q<80?2:Q<120?3:4;if(FIRES[fire].cap!==undefined)g=Math.min(g,FIRES[fire].cap);if(furn==='wa')g=Math.min(g,3);return g;}
function nameFor(a,g,path){
  let kind='normal',name;
  if(a.flags.chicken){kind='chicken';name='雞湯丹';g=1;}
  else if(g===0){kind='waste';name='廢丹';}
  else if(a.dev<=-3){kind='raw';name='生丹';g=Math.min(g,1);}
  else if(a.dev>=3){kind='burnt';name='焦炭丹';g=Math.min(g,1);}
  else if(a.flags.icefireOk){name='冰火九重天丹';g=Math.max(g,3);}
  else if(a.flags.sancai&&path!=='du'&&path!=='mo')name='三才造化丹';
  else if(a.flags.longxue)name='龍血丹';
  else if(a.flags.soul&&path==='du')name='斷魂丹';
  else if(a.flags.meng){kind='meng';name='忘情丹';}
  else name=NAMES[path][a.dom];
  return{kind,name,g};
}
const FAIL_KINDS=['waste','raw','burnt'];
function previewRecipe(r){
  const keep=JSON.stringify(cfg);
  try{
    Object.assign(cfg,{path:r.path,art:r.art,fire:r.fire,furn:r.furn,order:r.order.slice()});
    cfg.heat=r.heat||5;let a=analyse();
    if(!r.heat){cfg.heat=a.ideal;a=analyse();}
    const nm=nameFor(a,gradeFromQ(a.Q,cfg.fire,cfg.furn),cfg.path);
    const n=yieldCount();const inf=pillInfo(nm.name)||{path:cfg.path};
    const each=sellValue({name:nm.name,grade:nm.g,kind:nm.kind,path:inf.path});
    const rev=quoteN({name:nm.name,grade:nm.g,kind:nm.kind,path:inf.path},n);
    return{name:nm.name,g:nm.g,kind:nm.kind,heat:cfg.heat,rate:successRate(a),cost:costOf(),n,each,rev};
  }finally{Object.assign(cfg,JSON.parse(keep));}
}
function missingFor(c){

  if(!isUnl('fire',c.fire))m.push(FIRES[c.fire].n);
  if(!isUnl('furn',c.furn))m.push(FURN[c.furn].n);

function recordBrew(p){

function team(){

    if(m.role==='cai')t.disc+=m.skill*2*L;
    if(m.role==='ying')t.inc+=(10+m.skill*6)*(p.inc||1)*L;
    if(m.role==='chuan')t.pres+=m.skill*3*L;
  });
  moTeam(t);innerEffects(t);dlEffects(t);if(MS()&&!MS().left&&c.aff==='sect')t.stab+=4;
  if(c.aff==='xie')t.disc+=10;

function careerAfterBrew(grade,exploded){
  const c=C();const t=team();const msgs=[];
  // 丹術
  const xp=exploded?3:5+grade*5;
  c.sxp+=xp;
  while(c.skill<10&&c.sxp>=skillNeed(c.skill)){c.sxp-=skillNeed(c.skill);c.skill++;msgs.push('丹術提升到「'+SKILL_N[c.skill]+'」');}
  // 收入
  let inc=Math.round(t.inc);
  c.members.forEach(m=>{if(m.role==='ying'&&m.pers==='tan'&&rnd()<.2){const k=Math.round((10+m.skill*6)*.8);inc-=k;msgs.push(m.name+'袋袋平安，私吞咗 '+k+' 靈石');}});
  if(inc>0){P().stones+=inc;msgs.push((c.aff==='sect'?'門派月俸同營運':'營運')+'收入 '+inc+' 靈石');}
  // 弟子成長
  const chuan=c.members.filter(m=>m.role==='chuan').length;
  c.members.forEach(m=>{
    const base=m.role==='zhu'?4:m.role==='idle'?.5:2;
    m.xp+=(base+(m.role==='chuan'?0:chuan))*PERS[m.pers].g;
    while(m.skill<10&&m.xp>=(m.skill+1)*8){m.xp-=(m.skill+1)*8;m.skill++;msgs.push(m.name+'丹術升到'+SKILL_N[m.skill]);}
  });
  innerGrowBrew(msgs);
  if(exploded&&t.helpers.length&&rnd()<.5)msgs.push(t.helpers[0]+'被炸到成面黑，但冇大礙');
  // 聲望
  if(c.aff==='own'){
    const pr=Math.round((exploded?0:grade*grade*4)+t.pres);c.pres+=pr;if(pr>0)msgs.push('門派聲望 +'+pr);
    while(c.lvl<SECT_LV.length-1&&c.pres>=SECT_LV[c.lvl+1].need){c.lvl++;msgs.push(c.sectName+'晉升為「'+SECT_LV[c.lvl].n+'」！');if(c.lvl===4)P().lifeBonus+=300;}
  }
  if(!c.cands.length&&c.aff)refreshCands(true);
  return msgs;
}

/* ---------- 核心演算 ---------- */
function analyse(){
  const Pa=PATHS[cfg.path],A=ARTS[cfg.art],F=FIRES[cfg.fire],K=FURN[cfg.furn];
  const items=cfg.order.map(id=>Object.assign({id},ING[id]));
  const n=items.length;
  const el={m:0,w:0,s:0,f:0,e:0};
  const notes=[];const flags={};
  let pot=0,yy=0,tox=0,syn=0,stab=0,demon=0;
  items.forEach((it,i)=>{
    let wt=i===0?1.5:i===1?1.2:(i===n-1&&n>2)?.8:1;
    if(cfg.furn==='hulu'&&it.el==='s')wt*=1.3;
    el[it.el]+=it.pot*wt;pot+=it.pot*wt;yy+=it.yy;tox+=it.tox;
  });
  if(n>1){
    const maxPot=Math.max(...items.map(i=>i.pot));
    if(items[0].pot<maxPot){syn-=12;notes.push(['bad','君臣失序：最猛嗰味冇做君藥']);}
    else{syn+=6;notes.push(['good','君藥坐鎮，藥性有主']);}
  }
  let gen=0,ctl=0;
  for(let i=0;i<n-1;i++){
    const a=items[i].el,b=items[i+1].el;
    if(GEN[a]===b){gen++;syn+=9;}
    else if(CTRL[a]===b||CTRL[b]===a){ctl++;syn-=cfg.art==='wuwei'?5:11;stab-=cfg.art==='wuwei'?3:7;}
  }
  if(gen)notes.push(['good','五行相生 ×'+gen]);
  if(ctl)notes.push(['bad','五行相剋 ×'+ctl]);
  const has=id=>cfg.order.includes(id);
  if(has('duanchang')&&has('mantuo')){flags.soul=true;tox+=6;if(cfg.path==='du'){syn+=22;notes.push(['good','斷腸草配曼陀羅：斷魂之毒成形'])}else{stab-=10;notes.push(['bad','斷腸草配曼陀羅：毒氣攻爐'])}}
  for(let i=0;i<n-1;i++){const p=[items[i].id,items[i+1].id];if(p.includes('hanbing')&&p.includes('qilin'))flags.icefire=true;}
  if(flags.icefire){
    if(cfg.art==='wuwei'||cfg.furn==='bagua'){syn+=38;flags.icefireOk=true;notes.push(['good','冰火同爐，陰陽互濟'])}
    else{stab-=38;notes.push(['bad','寒冰魄貼住火麒麟角，冰火相沖！'])}
  }
  if(has('renshen')&&has('lingzhi')&&has('heshouwu')){flags.sancai=true;syn+=20;notes.push(['good','天地人三才齊聚'])}
  if(has('longxian')&&has('xueputi')){flags.longxue=true;syn+=15;yy+=2;notes.push(['good','龍涎香引血菩提：龍血之氣'])}
  if(has('xirang')){stab+=20;notes.push(['good','息壤鎮爐'])}
  if(has('mengpo'))flags.meng=true;
  if(has('yaodan'))demon+=6*cfg.order.filter(x=>x==='yaodan').length;
  if(n&&cfg.order.every(x=>x==='jitang'))flags.chicken=true;
  el[F.el]+=cfg.heat*F.mul*1.1;yy+=F.yy;
  const present=ELK.filter(k=>el[k]>=2.5).length;
  let fit=0;
  switch(cfg.path){
    case'zheng':fit=present*6-tox*2.5;break;
    case'mo':fit=(el.f*.7+Math.max(yy,0)*2.5)-Math.max(-yy,0)*2;demon+=12;break;
    case'du':fit=tox*3.2;break;
    case'fo':fit=(el.e+el.m)*.6+8-Math.abs(yy)*3.5;demon-=20;break;
    case'yi':fit=(el.w+el.s)*.6-tox*3;break;
  }
  if(cfg.fire==='jiuyou'&&(cfg.path==='mo'||cfg.path==='du'))fit+=10;
  if(cfg.furn==='bagua'&&present>=4){fit+=10;notes.push(['good','八卦爐：五行流轉'])}
  fit=clamp(fit,-30,50);
  if(cfg.art==='tianmo')demon+=12;if(cfg.art==='taishang')demon-=6;
  const avg=n?items.reduce((s,i)=>s+i.pot,0)/n:0;
  const ideal=clamp(Math.round(2+avg*.55)+Pa.shift,1,9);
  const bfx=bookFx();const dev=cfg.heat-ideal;const half=(cfg.art==='shenshi'?.5:1)*bfx.heat;
  let heatQ=0;
  if(dev>0){stab-=dev*9*half;heatQ-=dev*4*half;}
  if(dev<0)heatQ-=Math.abs(dev)*8*half;
  const tm=team();
  let Q=pot*2.2+syn+fit+A.pow+F.q+K.q+heatQ+tm.q+bfx.q;
  let S=55+tm.stab+bfx.stab+K.stab+A.stab+F.stab+stab-Math.abs(yy)*2.5-(cfg.path==='du'?0:tox*1.2);
  const dom=ELK.reduce((a,k)=>el[k]>el[a]?k:a,'m');
  let mName=null,mCount=0;
  if(n){const nm=nameFor({flags,dev,dom},gradeFromQ(Q,cfg.fire,cfg.furn),cfg.path);if(!FAIL_KINDS.includes(nm.kind)){mName=nm.name;mCount=mastery()[mName]||0;}}
  if(mCount){const mb=masteryBonus(mCount);Q+=mb.q;S+=mb.s;notes.push(['good','對「'+mName+'」'+masteryN(mCount)+'，得心應手']);}
  const boom=n?clamp((45-S)*2,0,95):0;
  return{el,yy,tox,Q,S,boom,ideal,dev,dom,notes,flags,demon,n,mName,mCount};
}

const cv=$('cv'),ctx=cv.getContext('2d');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,parts=[],glow=0,glowT=0,flash=0,smoke=[];
function resize(){const d=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.max(1,W*d);cv.height=Math.max(1,H*d);ctx.setTransform(d,0,0,d,0,0);}
if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));else window.addEventListener('resize',resize);
const dispFont=getComputedStyle(document.documentElement).getPropertyValue('--display');
function hexA(h,a){const n=parseInt(h.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+clamp(a,0,1)+')';}
function draw(t){
  const F=FIRES[cfg.fire];
  const sc=clamp(Math.min(W/420,H/330),.45,1.6);
  const cx=W/2,base=H*.5+120*sc;
  ctx.clearRect(0,0,W,H);
  const heat=cfg.heat/9;
  const g=ctx.createRadialGradient(cx,base,10,cx,base,Math.max(W,H)*.6);
  g.addColorStop(0,hexA(F.c[1],.22+heat*.25+glow*.3));g.addColorStop(1,'rgba(18,12,10,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const rate=reduce?1:Math.round(2+heat*6+(brewing?6:0));
  for(let i=0;i<rate;i++)parts.push({x:cx+(rnd()-.5)*110*sc,y:base+4*sc,vx:(rnd()-.5)*.6,vy:-(1.2+rnd()*2.2)*(.6+heat)*sc,life:1,s:(6+rnd()*10*(.5+heat))*sc});
  ctx.globalCompositeOperation='lighter';
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.03+rnd()*.02;p.s*=.97;
    const gg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s);gg.addColorStop(0,hexA(F.c[0],.8*p.life));gg.addColorStop(1,hexA(F.c[1],0));
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();});
  ctx.globalCompositeOperation='source-over';
  const bw=190*sc,top=base-160*sc,body=base-30*sc;
  ctx.fillStyle='#2b1d14';
  [-.32,.32,0].forEach(dx=>ctx.fillRect(cx+dx*bw-7*sc,body-4*sc,14*sc,36*sc));
  const bg=ctx.createLinearGradient(cx-bw/2,0,cx+bw/2,0);
  bg.addColorStop(0,'#5a4128');bg.addColorStop(.45,'#a07a45');bg.addColorStop(.55,'#b88f52');bg.addColorStop(1,'#4a3420');
  ctx.fillStyle=bg;ctx.beginPath();

    lines.push([who+'成個人發光，即場突破！','good']);

      if(m.cult!==undefined){const g=Math.round(e.cult*.5);m.cult+=g;lines.push([m.name+'修為 +'+g+'%，對你感激不盡。','good']);while(m.cult>=100&&m.realm<TOP){m.cult-=100;m.realm++;lines.push([m.name+'突破到「'+REALMS[m.realm]+'」！','good']);}}
      else if(rnd()<.3){m.realm++;lines.push([m.name+'突破到「'+REALMS[m.realm]+'」，對你感激不盡。','good']);}
    }
  }
  else lines.push([who+'話：「似乎有啲效，又似乎冇。」']);
  if(m&&c.members.includes(m)&&m.pers==='tan'&&rnd()<.3)lines.push([m.name+'食完仲問你：「'+(c.aff==='own'?'師父':'師兄')+'，呢粒可唔可以報銷？」']);
  lines.push(['你根據'+who+'嘅反應推算，如果自己食：']);
  useOne();
  showOutcome(who+'試藥',lines,'修為 '+sign(mine.cult)+'%　毒素 '+sign(mine.tox)+'　心魔 '+sign(mine.demon)+'　爆體風險 '+mine.risk+'%');
  afterAction();
}
function sell(){doSell(1);}

/* ---------- 生死 ---------- */
function lifespan(){const pl=P();return LIFE[pl.realm]+pl.lifeBonus;}
function checkLife(){
  const pl=P();if(!pl.alive)return;
  if(pl.realm>=9){save.st.flew++;endLife('白日飛升','你以丹入道，破碎虛空，飛升仙界。已故師弟 '+save.shidi+' 位喺天上望住你。',true);return;}
  if(pl.tox>=100)endLife('毒發身亡','體內毒素積到 '+Math.round(pl.tox)+'，全身經脈轉黑，你倒喺丹爐旁邊。');
  else if(pl.demon>=200)endLife('心魔反噬','心魔積到 '+Math.round(pl.demon)+'，你神智盡失，喺丹房入面自焚而亡。');
  else if(pl.age>=lifespan())endLife('壽元耗盡','你喺丹爐前坐化，享年 '+pl.age+' 歲。');
  else if(pl.demon>=100&&!MO().on)becomeMo();
  else if(MO().on&&pl.demon<40)reform();
}
function endLife(title,text,win){
  const pl=P();pl.alive=false;
  bioTrack();
  save.dead={title,text:text+'　最終境界：'+(pl.realm>=9?'飛升仙界':REALMS[pl.realm]+'期')+'。',win:!!win};
  lifeRecord(title,save.dead.text,win);
  checkAch();persist();renderAll();showDeath();
}
function showDeath(){
  const d=save.dead;if(!d)return;
  openOverlay('<h3 style="font-family:var(--display);font-weight:400;font-size:32px;margin:0;color:'+(d.win?'var(--bronze)':'var(--cinnabar)')+'">'+d.title+'</h3><p>'+d.text+'</p>'+(save.history&&save.history[0]?'<div class="lives">'+bioHtml(save.history[0],false).replace('<p class="desc">'+save.history[0].text+'</p>','')+'</div>':'')+'<div class="more-row"><button class="btn" type="button" id="seeLives">睇前世</button><button class="btn" type="button" id="rebirth">轉世重修（保留丹譜、丹書同成就）</button></div>');
  $('seeLives').onclick=()=>openTab('life');
  $('card').classList.toggle('death-card',!d.win);
  $('rebirth').onclick=()=>{save.player=newPlayer();delete save.dead;save.lives++;bioTrack();closeOverlay();$('log').innerHTML='';current=null;afterAction();toast('第 '+save.lives+' 世，重新入門');};
}

  $('stats').innerHTML=
    '<span class="stat"><span class="realm">'+realmName(pl.realm,pl.cult)+'</span></span>'+
    '<span class="stat"><span class="k">'+titleOf()+'</span><b>丹術'+SKILL_N[C().skill]+'</b></span>'+
    '<span class="stat"><span class="k">修為</span>'+m(pl.cult,'var(--jade)')+'<b>'+Math.round(pl.cult)+'%</b></span>'+
    '<span class="stat"><span class="k">毒</span>'+m(pl.tox,'#7cc04a')+'<b>'+Math.round(pl.tox)+'</b></span>'+
    '<span class="stat"><span class="k">心魔</span>'+m(pl.demon,'var(--cinnabar)')+'<b>'+Math.round(pl.demon)+'</b></span>'+
    '<span class="stat"><span class="k">年歲</span><b>'+pl.age+'/'+(ls>9000?'∞':ls)+'</b></span>'+
    '<span class="stat"><span class="k">靈石</span><b>'+pl.stones+'</b></span>'+

    (MO().on?'<span class="stat"><span class="k" style="color:var(--cinnabar)">惡名</span><b>'+Math.round(MO().infamy)+'</b></span>':'')+
    (()=>{const ta=LN().shidi,oa=LN().oldAge,mk=(P().mo&&P().mo.killed)||0;return'<span class="stat" title="試藥害死嘅師弟妹／弟子 '+ta+'，壽終坐化嘅入室弟子 '+oa+(mk?'；另外試藥害死凡人 '+mk:'')+'"><span class="k">已故弟子</span><b>'+(ta+oa)+'</b>'+(mk?'<span class="k">凡人</span><b>'+mk+'</b>':'')+'</span>';})();
  {const c=C();$('openCar').textContent=c.aff==='own'?c.sectName:c.aff==='sect'?SECTS[c.sect].n:c.aff==='xie'?'丹協':'丹途';}
  $('openAch').textContent='成就 '+save.ach.length+'/'+ACHS.length+(save.cheat?'・秘':'');
}
function renderAll(){
  renderRecipe();renderShelf();renderStats();renderInner();

  if(!$('modal').hidden)renderModal();
}

/* ---------- 成就／丹譜彈窗 ---------- */
let mTab='ach';
let lastTab=null;
function renderModal(){
  if(mTab!==lastTab){lastTab=mTab;const sc=$('mScroll');if(sc)sc.scrollTop=0;}
  [['mtBook','book'],['mtShop','shop'],['mtRoom','room'],['mtAch','ach'],['mtCodex','codex'],['mtCar','car'],['mtLife','life'],['mtRel','rel']].forEach(([id,t])=>$(id).setAttribute('aria-selected',mTab===t));
  if(mTab==='book'){$('mTitle').innerHTML='丹書<span>'+Object.keys(recipes()).length+' 條丹方　'+books().length+' 本藏書</span>';renderBooks();return;}
  if(mTab==='room'){$('mTitle').innerHTML='丹室<span>'+roomCount()+' / '+roomCap()+' 粒　你有 '+P().stones+' 靈石</span>';renderRoom();return;}
  if(mTab==='shop'){$('mTitle').innerHTML='商行<span>你有 '+P().stones+' 靈石</span>';renderShop();return;}
  if(mTab==='rel'){$('mTitle').innerHTML='人物關係<span>'+titleOf()+'</span>';renderRel();return;}
  if(mTab==='life'){$('mTitle').innerHTML='前世今生<span>第 '+save.lives+' 世</span>';renderLives();return;}
  if(mTab==='car'){$('mTitle').innerHTML='丹途門派<span>'+titleOf()+'</span>';renderCareer();return;}
  if(mTab==='ach'){
    $('mTitle').innerHTML='成就<span>已達成 '+save.ach.length+' / '+ACHS.length+'　第 '+save.lives+' 世</span>';
    $('mBody').innerHTML='<div class="achs">'+ACHS.map(a=>{const ok=save.ach.includes(a.id);return'<div class="ach'+(ok?'':' no')+'"><b>'+a.n+'</b><small>'+a.d+'</small>'+(a.u.length?'<span class="u">'+(ok?'已解鎖：'+a.u.map(labelOf).join('、'):'解鎖 '+a.u.length+' 項新選項')+'</span>':'')+'</div>';}).join('')+'</div>';
  }else{
    $('mTitle').innerHTML='丹譜<span>已收錄 '+save.codex.length+' / '+ALL_PILLS.length+'</span>';
    const R=recipes(),M=mastery();
    $('mBody').innerHTML='<div class="desc">金框嘅丹藥丹書有配方，撳一下即刻配好開爐。</div><div class="codex" style="margin-top:6px">'+ALL_PILLS.map(n=>{
      if(!save.codex.includes(n))return'<span class="unk">'+'？'.repeat(n.length)+'</span>';
      if(!R[n])return'<span title="丹書未有配方（失敗品唔會記錄）">'+n+'</span>';
      const miss=missingFor(R[n].cfg);
      return'<button type="button" class="cx" data-a="brew" data-n="'+n+'" title="'+(miss.length?'未有：'+miss.join('、'):'撳一下即煉，'+masteryN(M[n]||0))+'"'+(miss.length?' disabled':'')+'>'+n+(M[n]?'<small>×'+M[n]+'</small>':'')+'</button>';
    }).join('')+'</div>';
  }
}

function cheat(){
  const v=$('cheatIn').value.trim();$('cheatIn').value='';
  if(v==='急急如律令'){save.cheat=true;Object.keys(BOOKS).forEach(id=>gainBook(id));persist();renderAll();$('mMsg').textContent='天門大開：所有丹道、心法、火種、丹爐、藥材同藏書已經全部解鎖。';}
  else if(v==='丹道通神'){const c=C();c.skill=10;c.sxp=0;c.cert=9;save.st.maxCert=9;const pl=P();if(pl.realm<2){pl.realm=2;pl.cult=0;save.st.maxRealm=Math.max(save.st.maxRealm,2);}afterAction();$('mMsg').textContent='你忽然開竅：丹術宗師、九品丹證、金丹期。';}
  else if(v==='走火入魔'){P().demon=Math.max(P().demon,100);afterAction();$('mMsg').textContent='一股黑氣衝上天靈蓋……';}
  else if(v==='天劫將至'){const pl=P();pl.realm=TOP;pl.cult=100;save.st.maxRealm=TOP;afterAction();$('mMsg').textContent='你修為暴漲到渡劫圓滿，頂部出現「渡劫飛升」掣。';}
  else if(v==='點石成金'){P().stones+=10000;persist();renderAll();$('mMsg').textContent='袋入面多咗 10000 靈石。';}
  else $('mMsg').textContent='咒語無效，乜都冇發生。';
}
$('cheatGo').onclick=cheat;
$('cheatIn').onkeydown=e=>{if(e.key==='Enter')cheat();};
let resetArm=false;
$('reset').onclick=()=>{
  if(!resetArm){resetArm=true;$('mMsg').textContent='再撳多次「全部重來」就會清除所有進度、成就同丹譜。';setTimeout(()=>{resetArm=false;},4000);return;}
  save=newSave();UNL=unlockedSet();resetArm=false;ensureStart();Object.assign(cfg,JSON.parse(JSON.stringify(DEFAULT_CFG)));
  current=null;closeOverlay();$('log').innerHTML='';persist();renderAll();$('mMsg').textContent='天地重開。';
};

/* ---------- 其他 ---------- */
function gatherHerbs(){
  if(busy||!P().alive)return;
  const pl=P();pl.age+=1;
  const pool=Object.keys(ING).filter(id=>isUnl('ing',id)&&id!=='jitang');
  const pickers=C().members.filter(m=>m.role==='cai');
  const n=2+Math.floor(rnd()*3)+pickers.length+BAGS[DR().bagLv].extra;
  const got={};
  for(let i=0;i<n;i++){
    // 平嘢易搵，貴嘢難搵
    const w=pool.map(id=>1/Math.sqrt(ING[id].p));const tot=w.reduce((a,b)=>a+b,0);
    let r=rnd()*tot,k=0;while(r>w[k]){r-=w[k];k++;}
    const id=pool[Math.min(k,pool.length-1)];got[id]=(got[id]||0)+1;
  }
  let lostH=0;Object.keys(got).forEach(k=>{const a=bagAdd(k,got[k]);lostH+=got[k]-a;});
  const lines=[['你喺山上行咗一年，採到：'+Object.keys(got).map(k=>ING[k].n+(got[k]>1?'×'+got[k]:'')).join('、')+'。已經放入藥囊，煉丹時優先用，唔使錢。']];
  if(pickers.length)lines.push([pickers.map(m=>m.name).join('、')+'跟你上山，多採咗 '+pickers.length+' 份。','good']);
  if(BAGS[DR().bagLv].extra)lines.push([BAGS[DR().bagLv].n+'裝得多，多採咗 '+BAGS[DR().bagLv].extra+' 份。']);
  if(lostH)lines.push(['藥囊滿咗（'+bagCap()+' 份），有 '+lostH+' 份放唔落，唯有掉低。','bad']);
  const res=adventure('herb',lines);
  resolveAdv('上山採藥',lines,res);
}
